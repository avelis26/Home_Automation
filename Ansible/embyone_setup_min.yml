---
# Playbook to set up an Emby media server with Samba, Transmission, and LVM
# Prerequisites: Ubuntu Server, LVM volume /dev/mapper/vg_data-lv_data, secrets_one.yml
- hosts: embyone
  become: yes
  vars_files:
    - secrets_one.yml
  vars:
    emby_version: 4.8.9.0
    emby_deb_url: "https://github.com/MediaBrowser/Emby.Releases/releases/download/{{ emby_version }}/emby-server-deb_{{ emby_version }}_amd64.deb"
    emby_deb_path: "/tmp/emby-server-deb_{{ emby_version }}_amd64.deb"
    mount_point: /mnt/data
    lvm_device: /dev/mapper/vg_data-lv_data
    filesystem_type: ext4
    base_packages:
      - gpustat
      - nano
      - ffmpeg
      - iputils-ping
      - btop
      - samba
      - transmission-daemon
      - curl
      - git
      - python3-full
      - whois
      - traceroute
      - gcc
      - make
      - python3-tzlocal
      - python3-paramiko
      - nfs-kernel-server
  tasks:
    - name: Create SSH Directory
      file:
        path: "/home/{{ linux_user }}/.ssh"
        state: directory
        owner: "{{ linux_user }}"
        group: "{{ linux_user }}"
        mode: '0700'
      tags: [ssh]
    - name: Add SSH keys
      authorized_key:
        user: "{{ linux_user }}"
        key: "{{ item }}"
        state: present
      loop: "{{ ssh_keys + [lookup('file', '/home/pi-star/.ssh/id_rsa.pub')] }}"
      tags: [ssh]
    - name: Add User To Sudoers
      lineinfile:
        path: /etc/sudoers
        line: "{{ linux_user }} ALL=(ALL:ALL) NOPASSWD:ALL"
        validate: 'visudo -cf %s'
      tags: [ssh]
    - name: Create getty service directory
      file:
        path: /etc/systemd/system/getty@tty1.service.d
        state: directory
        owner: root
        group: root
        mode: '0755'
      tags: [autologin]
    - name: Configure auto-login for avelis on TTY1
      copy:
        dest: /etc/systemd/system/getty@tty1.service.d/autologin.conf
        content: |
          [Service]
          ExecStart=
          ExecStart=-/sbin/agetty --autologin avelis --noclear %I $TERM
        owner: root
        group: root
        mode: '0644'
      tags: [autologin]
    - name: Update APT cache and upgrade
      apt:
        update_cache: yes
        upgrade: dist
      register: apt_update_upgrade
      tags: [packages]
    - name: Install Base Packages
      apt:
        name: "{{ base_packages }}"
        state: present
      tags: [packages]
    - name: Update and upgrade Snap packages
      command: snap refresh
      register: snap_refresh
      changed_when: "'All snaps up to date' not in snap_refresh.stdout"
      tags: [packages]
    - name: Check installed Emby version
      command: dpkg -l emby-server | grep '^ii' | awk '{print $3}'
      register: emby_version_check
      changed_when: false
      failed_when: false
      tags: [emby]
    - name: Set Emby version fact
      set_fact:
        current_emby_version: "{{ emby_version_check.stdout | default('none') }}"
      tags: [emby]
    - name: Download Emby .deb
      get_url:
        url: "{{ emby_deb_url }}"
        dest: "{{ emby_deb_path }}"
      when: current_emby_version != emby_version
      tags: [emby]
    - name: Install or update Emby
      apt:
        deb: "{{ emby_deb_path }}"
      when: current_emby_version != emby_version
      notify: Restart Emby
      register: emby_install
      tags: [emby]
    - name: Check if LVM device exists
      stat:
        path: "{{ lvm_device }}"
      register: lvm_stat
      failed_when: not lvm_stat.stat.exists
      tags: [lvm]
    - name: Edit FSTAB
      mount:
        path: "{{ mount_point }}"
        src: "{{ lvm_device }}"
        fstype: "{{ filesystem_type }}"
        opts: defaults
        state: mounted
      when: lvm_stat.stat.exists
      tags: [lvm]
    - name: Create Samba User
      user:
        name: "{{ item.username }}"
        state: present
        groups: debian-transmission
        append: yes
        create_home: no
      with_items: "{{ samba_users }}"
      no_log: true
      tags: [samba]
    - name: Check if Samba user exists
      command: pdbedit -L
      register: samba_user_check
      changed_when: false
      failed_when: false
      tags: [samba, smbpasswd]
    - name: Set Samba Password
      shell: "printf '{{ item.password }}\n{{ item.password }}\n' | smbpasswd -a {{ item.username }}"
      when: item.username not in samba_user_check.stdout
      with_items: "{{ samba_users }}"
      tags: [samba, smbpasswd]
      no_log: true
    - name: Set Samba Directory
      file:
        path: /mnt/data
        state: directory
        owner: samba
        group: samba
        mode: "2775"
      tags: [samba]
    - name: Configure Samba Share
      blockinfile:
        path: /etc/samba/smb.conf
        block: |
          [data]
            path = /mnt/data
            valid users = {{ samba_users | map(attribute='username') | join(',') }}
            read only = no
            browsable = yes
            create mask = 0777
            directory mask = 0777
      notify: Restart Samba
      tags: [samba]
    - name: Add avelis to samba group
      user:
        name: avelis
        groups: samba
        append: yes
      tags: [permissions]
    - name: Stop Transmission Daemon
      systemd:
        name: transmission-daemon
        state: stopped
      tags: [transmission]
    - name: Update Transmission Settings
      template:
        src: transmission_settings.json
        dest: /etc/transmission-daemon/settings.json
        owner: debian-transmission
        group: debian-transmission
        mode: "0644"
      register: transmission_settings
      notify: Restart Transmission
      tags: [transmission]
    - name: Enable Transmission Daemon
      systemd:
        name: transmission-daemon
        enabled: yes
      tags: [transmission]
    - name: Change Transmission Type
      lineinfile:
        path: /lib/systemd/system/transmission-daemon.service
        regexp: '^Type=notify'
        line: 'Type=simple'
        state: present
      notify: Restart Transmission
      tags: [transmission]
    - name: Create a shared media group
      group:
        name: media_access
        state: present
      tags: [permissions]
    - name: Add users to media_access group
      user:
        name: "{{ item }}"
        groups: media_access
        append: yes
      loop:
        - emby
        - debian-transmission
        - avelis
        - samba
      tags: [permissions]
    - name: Set Emby Directories
      file:
        path: "{{ item.path }}"
        state: directory
        owner: emby
        group: emby
        mode: '0755'
      loop:
        - { path: "/mnt/data/emby" }
        - { path: "/var/lib/emby/metadata" }
        - { path: "/var/lib/emby/temp" }
        - { path: "/mnt/data/emby/backup" }
      tags: [emby, permissions]
    - name: Set Directory Permissions
      file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ item.owner }}"
        group: media_access
        mode: '2775'
        recurse: yes
      loop:
        - { path: "/mnt/data/Torrents", owner: "debian-transmission" }
        - { path: "/mnt/data/Media/Movies", owner: "avelis" }
        - { path: "/mnt/data/Media/Shows", owner: "avelis" }
        - { path: "/mnt/data/Media/Sports", owner: "avelis" }
      tags: [permissions]
    - name: Set permissions for /mnt/data excluding emby folder
      file:
        path: /mnt/data
        state: directory
        group: media_access
        mode: g+rwX
        recurse: yes
      tags: [permissions]
    - name: Restore emby folder permissions
      file:
        path: /mnt/data/emby
        state: directory
        owner: emby
        group: emby
        mode: '0755'
        recurse: yes
      tags: [permissions]
    - name: Update BASHRC for aliases and btop
      lineinfile:
        path: "/home/{{ linux_user }}/.bashrc"
        line: "{{ item }}"
        create: yes
        insertafter: EOF
      loop:
        - 'alias ls="ls -lhAp --color=always"'
        - 'alias ll="ls -lhAp --color=always"'
        - 'alias update="sudo apt update -y && sudo apt full-upgrade -y && sudo apt autoremove -y"'
        - 'alias nvtop="gpustat -a -i 1"'
        - 'export PATH="$PATH:/home/{{ linux_user }}/.local/bin"'
        - '[ -z "$SSH_CONNECTION" ] && [ -t 1 ] && btop'
      tags: [bashrc]
    - name: Configure NFS exports
      lineinfile:
        path: /etc/exports
        line: "/mnt/data 192.168.50.0/24(rw,sync,no_subtree_check)"
        create: yes
      notify: Restart NFS
      tags: [nfs]
    - name: Ensure NFS is running
      systemd:
        name: nfs-kernel-server
        state: started
        enabled: yes
      tags: [nfs]
    handlers:
      - name: Restart NFS
        systemd:
          name: nfs-kernel-server
          state: restarted
        tags: [nfs]
    - name: Reboot if necessary
      reboot:
        msg: "Rebooting system..."
      when: apt_update_upgrade.changed or snap_refresh.changed or emby_install.changed or transmission_settings.changed
      tags: [reboot]
  handlers:
    - name: Restart Emby
      systemd:
        name: emby-server
        state: restarted
        enabled: yes
      tags: [emby]
    - name: Restart Samba
      systemd:
        name: smbd
        state: restarted
        enabled: yes
      tags: [samba]
    - name: Restart Transmission
      systemd:
        name: transmission-daemon
        state: restarted
        enabled: yes
      tags: [transmission]
