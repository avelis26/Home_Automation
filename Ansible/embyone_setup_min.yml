- hosts: embyone
  become: yes
  vars_files:
    - secrets_one.yml

  tasks:
    # SSH
    - name: Create SSH Directory
      file:
        path: /home/{{ linux_user }}/.ssh
        state: directory
        owner: "{{ linux_user }}"
        group: "{{ linux_user }}"
        mode: '0700'

    - name: Add Gaming-PC SSH Key
      authorized_key:
        user: "{{ linux_user }}"
        key: "{{ item }}"
      loop: "{{ ssh_keys }}"

    - name: Add Pi-Star SSH Key
      authorized_key:
        user: "{{ linux_user }}"
        state: present
        key: "{{ lookup('file', '/home/pi-star/.ssh/id_rsa.pub') }}"
      delegate_to: embyone

    - name: Add User To Sudoers
      lineinfile:
        path: /etc/sudoers
        line: "{{ linux_user }} ALL=(ALL:ALL) NOPASSWD:ALL"
        validate: 'visudo -cf %s'

    # APT
    - name: Update & Upgrade APT
      apt:
        update_cache: yes
        upgrade: dist
      register: apt_update_upgrade

    # Snap
    - name: Update and upgrade Snap packages
      command: snap refresh
      register: snap_refresh
      changed_when: "'All snaps up to date' not in snap_refresh.stdout"
      tags: [packages]

    # Packages
    - name: Install Base Packages
      apt:
        name:
          - gpustat
          - nano
          - ffmpeg
          - iputils-ping
          - btop
          - samba
          - transmission-daemon
          - curl
          - git
          - python3-full
          - whois
          - traceroute
          - gcc
          - make
          - python3-tzlocal
          - python3-paramiko
        state: present
        update_cache: yes

    # NVIDIA
    #- name: Install NVIDIA Driver
    #  apt:
    #    name: "nvidia-driver-535-server"
    #    state: present
    #    update_cache: yes
    #  register: nvidia_install

    # Emby
    - name: Check installed Emby version
      command: dpkg -l emby-server | grep '^ii' | awk '{print $3}'
      register: emby_version_check
      changed_when: false
      failed_when: false
      tags: [emby]

    - name: Set Emby version fact
      set_fact:
        current_emby_version: "{{ emby_version_check.stdout | default('none') }}"
      tags: [emby]

    - name: Download Emby .deb
      get_url:
        url: "{{ emby_deb_url }}"
        dest: "{{ emby_deb_path }}"
      when: current_emby_version != emby_version
      tags: [emby]

    - name: Install or update Emby
      apt:
        deb: "{{ emby_deb_path }}"
      when: current_emby_version != emby_version
      notify: Restart Emby
      register: emby_install
      tags: [emby]

    - name: Reboot if necessary
      reboot:
        msg: "Rebooting system..."
      when: apt_update.changed or snap_refresh.changed or emby_install.changed
      tags: [reboot]
      #nvidia_install.changed

    # Reboot if necessary
    #- name: Reboot Conditionally
      #reboot:
        #msg: "Rebooting system..."
      #when: apt_update_upgrade.changed or emby_installed.rc != 0
      #when: apt_update_upgrade.changed or  or emby_installed.rc != 0

    # Bashrc
    - name: Update BASHRC
      lineinfile:
        path: "/home/{{ linux_user }}/.bashrc"
        line: "{{ item }}"
        create: yes
        insertafter: EOF
      loop:
        - 'alias ls="ls -lhAp --color=always"'
        - 'alias ll="ls -lhAp --color=always"'
        - 'alias update="sudo apt update -y && sudo apt full-upgrade -y && sudo apt autoremove -y"'
        - 'alias nvtop="gpustat -a -i 1"'
        - 'export PATH="$PATH:/home/{{ linux_user }}/.local/bin"'

    # Samba
    - name: Create Samba User
      user:
        name: "{{ item.username }}"
        state: present
        groups: debian-transmission
        append: yes
        create_home: no
      with_items:
        - "{{ samba_users }}"
      no_log: true

    - name: Set Samba Password
      shell: "printf '{{ item.password }}\n{{ item.password }}\n' | smbpasswd -a {{ item.username }}"
      with_items:
        - "{{ samba_users }}"
      tags: smbpasswd
      no_log: true

    - name: Set Samba Directory
      file:
        path: /mnt/data
        state: directory
        owner: samba
        group: samba
        mode: "2775"

    - name: Configure Samba Share
      blockinfile:
        path: /etc/samba/smb.conf
        block: |
          [data]
            path = /mnt/data
            valid users = {{ samba_users | map(attribute='username') | join(',') }}
            read only = no
            browsable = yes
            create mask = 0777
            directory mask = 0777

    # Fstab
    - name: Edit FSTAB
      mount:
        path: /mnt/data
        src: /dev/mapper/vg_data-lv_data
        fstype: ext4
        opts: defaults
        state: mounted

    # Transmission
    - name: Stop Transmission Daemon
      systemd:
        name: transmission-daemon
        state: stopped

    - name: Update Transmission Settings
      template:
        src: transmission_settings.json
        dest: /etc/transmission-daemon/settings.json
        owner: debian-transmission
        group: debian-transmission
        mode: "0644"

    - name: Enable Transmission Daemon
      systemd:
        name: transmission-daemon
        enabled: yes

    - name: Change Transmission Type
      lineinfile:
        path: /lib/systemd/system/transmission-daemon.service
        regexp: '^Type=notify'
        line: 'Type=simple'
        state: present

    # Directories
    - name: Create a shared media group
      group:
        name: media_access
        state: present
    
    - name: Add users to media_access group
      user:
        name: "{{ item }}"
        groups: media_access
        append: yes
      loop:
        - emby
        - debian-transmission
        - avelis
        - samba

    - name: Set Emby Directories
      file:
        path: "{{ item.path }}"
        state: directory
        owner: emby
        group: emby
        mode: '0755'
      loop:
        - { path: "/mnt/data/emby" }
        - { path: "/var/lib/emby/metadata" }
        - { path: "/var/lib/emby/temp" }
        - { path: "/mnt/data/emby/backup" }

    - name: Set Directory Permissions
      file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ item.owner }}"
        group: media_access
        mode: '2775'
        recurse: yes
      loop:
        - { path: "/mnt/data/Torrents", owner: "debian-transmission" }
        - { path: "/mnt/data/Media/Movies", owner: "avelis" }
        - { path: "/mnt/data/Media/Shows", owner: "avelis" }
        - { path: "/mnt/data/Media/Sports", owner: "avelis" }

    # Reboot
    - name: Reboot
      reboot:
        msg: "Rebooting system..."

  handlers:
  - name: Restart Emby
    systemd:
      name: emby-server
      state: restarted
      enabled: yes
    tags: [emby]
